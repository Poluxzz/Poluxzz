name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Poluxzz
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00CFFF&color_dots=#0D1B2A,#123E66,#1769AA,#2196F3,#00CFFF
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00CFFF&color_dots=#0D1B2A,#123E66,#1769AA,#2196F3,#00CFFF

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
