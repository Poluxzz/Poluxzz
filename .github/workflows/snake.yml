name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Poluxzz
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=deepskyblue&color_dots=#071A2B,#0B3D62,#087EA4,#00AEEF,#00D9FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=deepskyblue&color_dots=#071A2B,#0B3D62,#087EA4,#00AEEF,#00D9FF

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update blue snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
