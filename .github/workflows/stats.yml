
name: Atualizar GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gerar GitHub Statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Poluxzz&show_icons=true&locale=pt-br&commits_year=2026&include_all_commits=true&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9&icon_color=79C0FF&border_color=1F6FEB&ring_color=58A6FF&custom_title=Minhas%20Estat%C3%ADsticas
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Gerar Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Poluxzz&layout=compact&langs_count=8&role=OWNER,COLLABORATOR&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9&icon_color=79C0FF&border_color=1F6FEB
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Atualizar versão do cache
        run: |
          VERSION=$(date +%s)

          sed -i -E 's|(stats\.svg\?v=)[0-9]+|\1'"$VERSION"'|g' README.md
          sed -i -E 's|(top-langs\.svg\?v=)[0-9]+|\1'"$VERSION"'|g' README.md

      - name: Salvar estatísticas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/ README.md

          if ! git diff --cached --quiet; then
            git commit -m "Atualizar GitHub Stats"

            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main

              if git push origin HEAD:main; then
                echo "Estatísticas atualizadas com sucesso!"
                exit 0
              fi

              echo "Tentativa $attempt falhou. Tentando novamente..."
            done

            echo "Não foi possível enviar as estatísticas."
            exit 1
          else
            echo "Nenhuma alteração para salvar."
          fi
